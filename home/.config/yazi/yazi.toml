[mgr]
# show_hidden = true
show_symlink = true

[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"

[opener]
edit = [
    { run = "/usr/bin/env NVIM_APPNAME=LazyVim lvim %s", desc = "LazyVim", for = "unix", block = true },
]
