# ─── General ────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 10000
set -g base-index 1              # start window numbering at 1
set -g pane-base-index 1
set -g renumber-windows on       # re-number windows when one is closed
set -sg escape-time 10           # no delay for escape key
set -g focus-events on
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g mode-style 'reverse'
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# ─── Mouse ──────────────────────────────────────────────────────────────────
set -g mouse on

# ─── Prefix: Ctrl+Space ─────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ─── Reload config ──────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# ─── Splits (open in current path) ──────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ─── Pane navigation (Vim-style) ────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# ─── Pane selection by number (Alt+N, no prefix needed) ─────────────────────
bind -n M-1 select-pane -t .1
bind -n M-2 select-pane -t .2
bind -n M-3 select-pane -t .3
bind -n M-4 select-pane -t .4
bind -n M-5 select-pane -t .5
bind -n M-6 select-pane -t .6
bind -n M-7 select-pane -t .7
bind -n M-8 select-pane -t .8
bind -n M-9 select-pane -t .9

# ─── Pane resizing ──────────────────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── Run Lazygit in popup ──────────────────────────────────────────────────────────
bind -r g display-popup -d '#{pane_current_path}' -w85% -h85% -E lazygit

# ─── Copy mode (vi keys) ────────────────────────────────────────────────────
set -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel


# ─── Status Bar ──────────────────────────────────────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default"

# No left segment
set -g status-left ""
set -g status-left-length 0
set -g status-justify left

# Window tabs: ≡ flanks on active, dim text on inactive
set -g window-status-separator ""
set -g window-status-format         "#[fg=default,bg=default] #I #W "
set -g window-status-current-format "#[fg=#9d7cf9,bg=default] #[fg=default,bold,bg=#9d7cf8] #I #W #[fg=#9d7cf8,bg=default]"
set -g window-status-style          "bg=default"
set -g window-status-current-style  "bg=default"

# Pane borders
set -g pane-border-style        "fg=#2a2b3d"
set -g pane-active-border-style "fg=#9d7cf8"

# Right: metrics
set -g status-right-length 120
set -g status-right "#[fg=#565f89,bg=default]#(~/.config/tmux/status-right.sh)  "

# ─── Plugins ────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# ─── Resurrect / Continuum ──────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'    # auto-restore on tmux start
set -g @continuum-save-interval '10'  # save every 15 minutes
set -g @resurrect-capture-pane-contents 'on' # preserves context of panes (e.g. scrollback history, editor state, etc.)

# ─── Processes that will be restored after session is dead ────────────────────────────────────────────────────────────────
set -g @resurrect-processes 'claude'


# ─── Initialize TPM (keep at bottom) ────────────────────────────────────────
run ~/.config/tmux/plugins/tpm/tpm

bind -n C-k clear-history
