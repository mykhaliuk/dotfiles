# The key left of 1 reports as grave (ANSI) or 102nd (ISO). Check with `sudo keyd monitor`.
[ids]
*

[main]
grave = esc
102nd = esc
capslock = layer(media)
fn = layer(fn)

[media]
space = C-b
a = volumedown
s = mute
d = volumeup
e = brightnessup
w = brightnessdown
1 = f1
2 = f2
3 = f3
4 = f4
5 = f5
6 = f6
7 = f7
8 = f8
9 = f9
0 = f10
minus = f11
equal = f12

[fn]
grave = `
102nd = `
